name: Limon Launcher EXE derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bagimliliklari kur
        run: npm install

      - name: EXE derle
        run: npm run build

      - name: Derlemeyi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: Limon-Launcher-Windows
          path: dist/*.exe

      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Limon Launcher build ${{ github.run_number }}
          files: dist/*.exe
